id: io.github.novakr12.SoundscapeDesktop
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: soundscape-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: soundscape-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/soundscape-desktop/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/soundscape-desktop /app/bin/soundscape-desktop
      - install -Dm644 flatpak/io.github.novakr12.SoundscapeDesktop.desktop /app/share/applications/io.github.novakr12.SoundscapeDesktop.desktop
      - install -Dm644 flatpak/io.github.novakr12.SoundscapeDesktop.metainfo.xml /app/share/metainfo/io.github.novakr12.SoundscapeDesktop.metainfo.xml
      - install -Dm644 src-tauri/icons/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.novakr12.SoundscapeDesktop.svg
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.novakr12.SoundscapeDesktop.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.novakr12.SoundscapeDesktop.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.novakr12.SoundscapeDesktop.png
    sources:
      - type: git
        url: https://github.com/novakr12/soundscape-desktop.git
        tag: v0.1.0
        commit: d0103ac758fa6e9f3c0afb80e6ed65678cfca0a4
      - cargo-sources.json
